[pytest]
asyncio_mode = auto
log_cli = True
log_level = INFO
norecursedirs=tests/legacy
markers =
    devtest: marks a test to run during dev validation, and not deployment (deselect with '-m "not devtest"')
    serial
    requires_credentials(vendor): skips the test unless the API credentials of vendor (alpaca, gemini or tradier) are set
