# This is a TOML configuration file.

# how many minutes, before end of the trading day to enforce liquidation
# market_liquidation_end_time_minutes = 15

# symbol filters, may have several
[filters.momentum]
class = "liualgotrader.filters.momentum.Momentum"

# scan for tickers with minimal volume since day start
min_volume = 30000

# minimum daily percentage change
today_change_percent = 3.5

# minimum last day dollar volume
min_last_dv = 500000

max_share_price = 20.0
min_share_price = 2.0

# how many minutes from market open to start running the filter
from_market_open = 15

# minutes between runs
recurrence = 5

# signals; each one evaluates the symbols of the filters it lists
[signals.breakout]
class = "MomentumSignal"
filename = "./momentum_long_simplified.py"
filters = ["momentum"]
# length of the opening range, in minutes
breakout_minutes = 15

# rules; each one decides on the signals it lists
[rules.momentum_long]
class = "MomentumLongRule"
filename = "./momentum_long_simplified.py"
signals = ["breakout"]
# position sizing belongs to the rule
portfolio_value = 25000.0
risk = 0.001
# how many minutes after the open to buy at market
morning_rush_minutes = 30
