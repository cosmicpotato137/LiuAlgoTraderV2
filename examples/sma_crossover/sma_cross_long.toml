# This is a TOML strategy file, which describes one strategy completely.
#
# A momentum strategy: buy when the 10-bar simple moving average of the close
# crosses above the 30-bar one, and sell when it crosses back below. Back-test
# it on daily bars from the repository root, for example:
#
#   TRADEPLAN_DIR=examples/sma_crossover backtester from 2024-01-01 --to=2024-12-31

# the name of the strategy, unique within the trade plan; the filter, signal
# and rule below have it too
name = "sma_cross_long"

# the filter, which selects the symbols that the signal evaluates
[filter]
class = "MyFilter"
filename = "examples/sma_crossover/filter.py"
symbols = ["AAPL", "MSFT", "NVDA"]

# To trade the picks of the momentum filter instead, replace the filter table
# above with this one. In back-tests it only replays the picks that the live
# trader recorded for a strategy of the same name.
# [filter]
# class = "liualgotrader.filters.momentum.Momentum"
# min_volume = 30000
# today_change_percent = 3.5
# min_last_dv = 500000
# max_share_price = 20.0
# min_share_price = 2.0
# from_market_open = 15
# recurrence = 5

# the signal, which evaluates the symbols of the filter
[signal]
class = "SmaCrossover"
filename = "examples/sma_crossover/strategy.py"
fast = 10
slow = 30
# calendar days of bars to read, which must cover `slow` bars; a few days are
# enough for minute bars
lookback_days = 60

# the rule, which decides on the signal
[rule]
class = "SmaCrossoverRule"
filename = "examples/sma_crossover/strategy.py"
qty = 10
